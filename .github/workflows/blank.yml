name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: powershell
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow

        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

        Get-ComputerInfo |
          Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, TotalPhysicalMemory

        Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

    - name: Enable RDP
      shell: powershell
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        Write-Host "Remote Desktop enabled." -ForegroundColor Green

    - name: Enable Windows Audio
      shell: powershell
      run: |
        Write-Host "Enabling Windows Audio..." -ForegroundColor Green

        $audio = Get-Service -Name "Audiosrv" -ErrorAction Stop

        Set-Service `
          -Name "Audiosrv" `
          -StartupType Automatic

        if ($audio.Status -ne "Running") {
          Start-Service -Name "Audiosrv"
        }

        Write-Host "Windows Audio service is enabled." -ForegroundColor Green

    - name: Enable RDP Audio Redirection
      shell: powershell
      run: |
        Write-Host "Configuring RDP audio..." -ForegroundColor Green

        $rdpPolicy = `
          "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

        New-Item `
          -Path $rdpPolicy `
          -Force | Out-Null

        # Permitir reprodução de áudio pelo RDP
        Set-ItemProperty `
          -Path $rdpPolicy `
          -Name "fDisableAudio" `
          -Type DWord `
          -Value 0

        # Permitir captura de áudio pelo RDP
        Set-ItemProperty `
          -Path $rdpPolicy `
          -Name "fDisableAudioCapture" `
          -Type DWord `
          -Value 0

        Write-Host "RDP audio redirection enabled." -ForegroundColor Green

    - name: Check Microsoft Store
      shell: powershell
      run: |
        Write-Host "Checking Microsoft Store..." -ForegroundColor Cyan

        $store = Get-AppxPackage `
          -AllUsers `
          -Name "Microsoft.WindowsStore" `
          -ErrorAction SilentlyContinue

        if ($null -ne $store) {
          Write-Host "Microsoft Store is installed." -ForegroundColor Green
          Write-Host "Store version: $($store.Version)" -ForegroundColor Green
        }
        else {
          Write-Host "Microsoft Store is not included in this Windows Server image." -ForegroundColor Yellow
          Write-Host "The runner is Windows Server 2022, not Windows 10." -ForegroundColor Yellow
        }

        Write-Host "Checking AppX services..." -ForegroundColor Cyan

        $services = @(
          "AppXSvc",
          "ClipSVC",
          "InstallService"
        )

        foreach ($name in $services) {

          $service = Get-Service `
            -Name $name `
            -ErrorAction SilentlyContinue

          if ($null -ne $service) {

            Write-Host "$name found." -ForegroundColor Green

            try {
              Set-Service `
                -Name $name `
                -StartupType Manual `
                -ErrorAction Stop
            }
            catch {
              Write-Host "Could not change $name startup configuration." -ForegroundColor Yellow
            }
          }
          else {
            Write-Host "$name is not available." -ForegroundColor Yellow
          }
        }

    - name: Create Rafael User Account
      shell: powershell
      run: |
        Write-Host "Creating Rafael account..." -ForegroundColor Green

        $Password = ConvertTo-SecureString `
          "P@ssw0rd!" `
          -AsPlainText `
          -Force

        $rafael = Get-LocalUser `
          -Name "Rafael" `
          -ErrorAction SilentlyContinue

        if ($null -eq $rafael) {

          New-LocalUser `
            -Name "Rafael" `
            -Password $Password `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true

          Write-Host "Rafael account created." -ForegroundColor Green
        }
        else {

          Set-LocalUser `
            -Name "Rafael" `
            -Password $Password

          Write-Host "Rafael account already exists." -ForegroundColor Yellow
        }

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member "Rafael" `
          -ErrorAction SilentlyContinue

        Add-LocalGroupMember `
          -Group "Administrators" `
          -Member "Rafael" `
          -ErrorAction SilentlyContinue

        Write-Host "Username: Rafael" -ForegroundColor Yellow
        Write-Host "Rafael is an administrator and Remote Desktop user." -ForegroundColor Green

    - name: Restart Audio Service
      shell: powershell
      run: |
        Write-Host "Restarting Windows Audio..." -ForegroundColor Green

        Restart-Service `
          -Name "Audiosrv" `
          -Force

        Write-Host "Audio service restarted successfully." -ForegroundColor Green

    - name: Install Tailscale
      shell: powershell
      run: |
        Write-Host "Downloading Tailscale..." -ForegroundColor Green

        $tsUrl = `
          "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

        $installerPath = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest `
          -Uri $tsUrl `
          -OutFile $installerPath

        Write-Host "Installing Tailscale..." -ForegroundColor Green

        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
          -Wait

        Remove-Item `
          $installerPath `
          -Force `
          -ErrorAction SilentlyContinue

        Write-Host "Tailscale installed successfully!" -ForegroundColor Green

    - name: Start Tailscale
      shell: powershell
      run: |
        Write-Host "Starting Tailscale..." -ForegroundColor Green

        & "C:\Program Files\Tailscale\tailscale.exe" up `
          --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" `
          --hostname "enigmano-${{ github.run_id }}"

        Start-Sleep -Seconds 15

    - name: Get Tailscale IP
      shell: powershell
      run: |
        $tsIP = & `
          "C:\Program Files\Tailscale\tailscale.exe" `
          ip -4

        $tsIP = ($tsIP | Select-Object -First 1).Trim()

        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Install Google Chrome
      shell: powershell
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green

        $chromeUrl = `
          "https://dl.google.com/chrome/install/latest/chrome_installer.exe"

        $installerPath = `
          "$env:TEMP\chrome_installer.exe"

        Invoke-WebRequest `
          -Uri $chromeUrl `
          -OutFile $installerPath

        Write-Host "Installing Google Chrome..." -ForegroundColor Green

        Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/silent /install" `
          -Wait

        Remove-Item `
          $installerPath `
          -Force

        Write-Host "Google Chrome installed!" -ForegroundColor Green

    - name: Install 7-Zip
      shell: powershell
      run: |
        Write-Host "Downloading 7-Zip..." -ForegroundColor Green

        $zipUrl = `
          "https://www.7-zip.org/a/7z2409-x64.exe"

        $installerPath = `
          "$env:TEMP\7z-installer.exe"

        Invoke-WebRequest `
          -Uri $zipUrl `
          -OutFile $installerPath

        Write-Host "Installing 7-Zip..." -ForegroundColor Green

        Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/S" `
          -Wait

        Remove-Item `
          $installerPath `
          -Force

        Write-Host "7-Zip installed!" -ForegroundColor Green

    - name: Connection Details
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green

        Write-Host "Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "Username: Rafael" -ForegroundColor White
        Write-Host "Audio: ENABLED" -ForegroundColor Green

        Write-Host ""
        Write-Host "Connection Instructions:" -ForegroundColor Yellow
        Write-Host "1. Connect to the Tailscale network." -ForegroundColor White
        Write-Host "2. Open Remote Desktop." -ForegroundColor White
        Write-Host "3. Enter the Tailscale IP shown above." -ForegroundColor White
        Write-Host "4. Username: Rafael" -ForegroundColor White
        Write-Host "5. Enable 'Play audio on this device' in the RDP client." -ForegroundColor White

    - name: Keep Session Alive
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow

        $counter = 0

        while ($true) {

          $counter++

          Write-Host `
            "Session active - Heartbeat #$counter ($(Get-Date))" `
            -ForegroundColor Green

          # Verificar áudio
          $audioStatus = `
            (Get-Service -Name "Audiosrv").Status

          if ($audioStatus -eq "Running") {

            Write-Host `
              "Windows Audio: ACTIVE" `
              -ForegroundColor Green
          }
          else {

            Write-Host `
              "Windows Audio: ERROR - Restarting..." `
              -ForegroundColor Red

            Set-Service `
              -Name "Audiosrv" `
              -StartupType Automatic

            Start-Service `
              -Name "Audiosrv"
          }

          # Verificar Tailscale
          $tsStatus = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            status

          if ($LASTEXITCODE -eq 0) {

            Write-Host `
              "Tailscale: ACTIVE" `
              -ForegroundColor Green
          }
          else {

            Write-Host `
              "Tailscale: ERROR - Restarting..." `
              -ForegroundColor Red

            & "C:\Program Files\Tailscale\tailscale.exe" up `
              --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" `
              --hostname "enigmano-${{ github.run_id }}"
          }

          Start-Sleep -Seconds 60
        }
